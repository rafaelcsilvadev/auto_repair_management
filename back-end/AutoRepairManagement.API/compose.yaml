services:
  autorepairmanagement.api:
    image: autorepairmanagement.api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/autorepair.db
    volumes:
      - autorepair-data:/app/data
    restart: unless-stopped

volumes:
  autorepair-data:

